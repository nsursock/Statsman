# Force Dockerfile (not Nixpacks) so native deps match the image.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# Prefer EU West (Amsterdam) to colocate with Supabase eu-west-1.
# Friendly name eu-west → europe-west4-drams3a.
multiRegionConfig = { "europe-west4-drams3a" = { numReplicas = 1 } }
