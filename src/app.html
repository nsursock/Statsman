<!doctype html>
<html lang="en" data-theme="retrowave">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#ff3e00" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Statsman" />
		<script>
			try {
				var t = localStorage.getItem('statsman-theme');
				var ok = [
					'retrowave',
					'synthwave84',
					'fiesta',
					'goldenTwilight',
					'solarizedDark',
					'ghibli',
					'dawn',
					'cottonCandy',
					'brightContrasts'
				];
				if (t && ok.indexOf(t) !== -1) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[var(--scifi-bg)] text-[var(--scifi-text)]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
