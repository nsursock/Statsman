<!doctype html>
<html lang="en" data-theme="retrowave">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				var t = localStorage.getItem('statsman-theme');
				var ok = [
					'retrowave',
					'synthwave84',
					'fiesta',
					'goldenTwilight',
					'solarizedDark',
					'ghibli',
					'dawn',
					'cottonCandy',
					'brightContrasts'
				];
				if (t && ok.indexOf(t) !== -1) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[var(--scifi-bg)] text-[var(--scifi-text)]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
